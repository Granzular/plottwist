[project]
name = "plottwist"
version = "0.1.0"
description = "A Django workspace for MATLAB-to-Python translation and DSP visualization."
readme = "README.md"
authors = [
    { name = "Granzular", email = "ayenimichael92@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "groq>=1.7.0",
    "gunicorn>=27.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "whitenoise>=6.12.0",
]

[project.scripts]
plottwist = "plottwist:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pypdf>=7.1.1",
]
