{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="mx-auto max-w-6xl px-4 py-8 sm:px-8 sm:py-12">
    <header class="mb-8 flex flex-wrap items-end justify-between gap-4 border-b border-rule pb-6">
        <div>
            <h1 class="font-serif text-4xl font-semibold tracking-tight text-accent sm:text-5xl">plottwist<span aria-hidden="true">.</span></h1>
            <p class="mt-3 text-base text-muted sm:text-lg">MATLAB to Python. Code to plots.</p>
        </div>
        <p class="pb-1 font-mono text-xs tracking-wide text-muted">DSP coursework</p>
    </header>

    <main id="workspace" tabindex="-1" class="grid min-w-0 gap-6 outline-none lg:grid-cols-2 lg:gap-8">
        <form id="run-form" action="{% url 'core:run' %}" method="post" data-max-bytes="{{ max_source_bytes }}" aria-labelledby="source-heading" class="min-w-0">
            {% csrf_token %}
            <div class="mb-3 flex min-h-8 items-center justify-between gap-4">
                <h2 id="source-heading" class="text-base font-semibold">
                    <label for="matlab-code">MATLAB code</label>
                </h2>
                <span class="font-mono text-xs text-muted">Source</span>
            </div>
            <div class="overflow-hidden rounded-md border border-rule bg-white focus-within:border-accent focus-within:ring-1 focus-within:ring-accent">
                <div aria-hidden="true" class="border-b border-rule bg-surface px-4 py-2.5 font-mono text-xs text-muted">MATLAB</div>
                <textarea id="matlab-code" name="matlab_code" aria-describedby="source-help run-help" required maxlength="{{ max_source_bytes }}" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" class="block min-h-80 w-full resize-y overflow-x-auto border-0 bg-white p-4 font-mono text-sm leading-7 text-ink outline-none sm:min-h-104" rows="11">{% if matlab_code != None %}{{ matlab_code }}{% else %}% A sampled sine wave
fs = 1000;
t = 0:1/fs:0.1;
f = 50;

x = sin(2*pi*f*t);

plot(t, x);
xlabel('Time (s)');
ylabel('Amplitude');
grid on;{% endif %}</textarea>
            </div>
            <p id="source-help" class="mt-3 text-sm text-muted">Editable MATLAB source</p>
            <div class="mt-5 flex flex-wrap items-center gap-x-4 gap-y-3">
                <button id="run-button" type="submit" aria-describedby="run-help" class="inline-flex min-h-11 items-center justify-center gap-2 rounded bg-accent px-5 py-2.5 text-sm font-semibold text-white hover:brightness-110 disabled:cursor-wait disabled:bg-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
                    <svg aria-hidden="true" viewBox="0 0 16 16" class="size-3.5 fill-current"><path d="M4 2.5 13 8l-9 5.5z"/></svg>
                    <span id="run-label">Run</span>
                </button>
                <p id="run-help" role="status" aria-live="polite" class="max-w-64 text-sm leading-5 text-muted">Ready to run</p>
            </div>
        </form>

        <div id="results" class="min-w-0 space-y-6" aria-label="Run results">
            {% include 'core/results.html' %}
        </div>
    </main>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/workspace.js' %}" defer></script>
{% endblock %}
